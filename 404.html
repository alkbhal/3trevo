<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --v0:#050f07;--v2:#0f2d1a;--v3:#1e5c3a;--v4:#2d7a50;
  --v6:#a8c5a0;--v8:#edf5eb;--ouro:#c9a84c;
  --bg:#f8f5ef;--branco:#ffffff;--borda:#e0dbd2;
  --t0:#111a0e;--t1:#2a3a26;--t2:#5a6a54;--t3:#8a9a84;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--t0);min-height:100vh;display:flex;flex-direction:column}

.hdr{background:rgba(10,31,14,.97);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:center}
.logo{font-family:var(--serif);font-weight:400;font-size:16px;color:rgba(255,255,255,.92);text-decoration:none}
.logo span{color:var(--v6)}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.card{max-width:480px}
.num{font-family:var(--serif);font-size:clamp(80px,15vw,140px);font-weight:200;color:var(--v3);line-height:1;margin-bottom:16px;opacity:.25}
h1{font-family:var(--serif);font-size:clamp(22px,4vw,32px);font-weight:300;color:var(--t0);margin-bottom:12px}
.sub{font-size:15px;color:var(--t2);line-height:1.7;margin-bottom:32px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 24px;font-size:14px;font-weight:600;font-family:var(--sans);text-decoration:none;transition:all .2s;border-radius:2px}
.btn-pri{background:var(--v3);color:#fff}
.btn-pri:hover{background:var(--v4)}
.btn-sec{background:transparent;color:var(--v3);border:1.5px solid var(--borda)}
.btn-sec:hover{border-color:var(--v3)}

.ft{background:var(--v0);padding:20px 24px;text-align:center;font-size:11px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<header class="hdr">
  <a href="/" class="logo">Editora Tres <span>Trevo</span></a>
</header>
<main class="main">
  <div class="card">
    <div class="num">404</div>
    <h1>Pagina nao encontrada</h1>
    <p class="sub">A pagina que voce procura pode ter sido movida ou nao existe mais. Que tal explorar nosso catalogo?</p>
    <div class="btns">
      <a href="/" class="btn btn-pri">Ir para o inicio</a>
      <a href="/catalogo.html" class="btn btn-sec">Ver catalogo</a>
    </div>
  </div>
</main>
<footer class="ft">Editora Tres Trevo · CNPJ 18.928.966/0001-59 · Montauri/RS</footer>
</body>
</html>
