name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stamp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica se os hashes de cache-busting batem com o conteudo real
        run: node scripts/stamp.mjs --check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Empacota produção e staging sem publicar: pega erro de build antes da subida.
      - run: npx wrangler deploy --dry-run --outdir /tmp/build-prod
      - run: npx wrangler deploy --env staging --dry-run --outdir /tmp/build-staging
