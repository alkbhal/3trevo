name = "tres-trevo-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://xfkepekffdyrtcgagwqo.supabase.co"

# Secrets (configurar via: npx wrangler secret put NOME)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# RESEND_API_KEY
# WEBHOOK_HMAC_SECRET
# ANTHROPIC_KEY
# R2_PUBLIC_BUCKET_ID    (opcional — se usar R2 para PDFs)
# FORGE_API_SECRET       (mesmo valor do tr3vo-forge — a loja busca o livro no servidor)

# KV namespace para rate limiting e health monitor
[[kv_namespaces]]
binding = "TT_KV"
id = "34f4ad1650394b77a51ae527a0437a24"

# R2 bucket privado para EPUBs da Biblioteca TT
[[r2_buckets]]
binding = "BIBLIOTECA_R2"
bucket_name = "tt-biblioteca"

# Livros do tr3vo-forge: buscados no servidor por canal interno (fetch entre
# workers.dev da mesma conta é bloqueado — erro 1042). O comprador nunca vê o forge.
[[services]]
binding = "FORGE"
service = "tr3vo-forge"

# Crons:
# - Toda hora: health monitor (checa componentes, detecta ataques, alerta via email)
# Sorteio puro RNG: disparado manualmente via POST /api/admin/sorteio (sem data fixa)
[triggers]
crons = ["0 * * * *"]

# ── STAGING (cópia de teste, isolada da produção) ─────────────────────────────
# Sobe com: npm run deploy:staging → https://tres-trevo-api-staging.<conta>.workers.dev
# No wrangler, vars, KV, R2 e services NÃO são herdados pelo [env]: o que não estiver
# declarado aqui não existe no staging. Isso é proposital — staging nunca toca o banco,
# o KV, o R2 nem o forge de produção. Segredos próprios, com --env staging:
#   npx wrangler secret put SUPABASE_URL --env staging          (projeto Supabase DE TESTE)
#   npx wrangler secret put SUPABASE_SERVICE_KEY --env staging  (chave do projeto de teste)
#   npx wrangler secret put ADMIN_SECRET --env staging
#   npx wrangler secret put FORGE_WEBHOOK_SECRET --env staging  (opcional, p/ testar o webhook)
# NÃO configure RESEND_API_KEY, MP_ACCESS_TOKEN de produção nem WHATSAPP_* no staging.
[env.staging]
name = "tres-trevo-api-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"

# KV e R2 PRÓPRIOS do staging (sem id: o wrangler cria na primeira subida e grava aqui).
[[env.staging.kv_namespaces]]
binding = "TT_KV"

[[env.staging.r2_buckets]]
binding = "BIBLIOTECA_R2"
bucket_name = "tt-biblioteca-staging"

# Sem cron no staging: nada de monitor, e-mail ou sorteio automático rodando em teste.
[env.staging.triggers]
crons = []
