name = "tres-trevo-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (configurar via: npx wrangler secret put NOME)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# RESEND_API_KEY
# WEBHOOK_HMAC_SECRET
# ANTHROPIC_KEY
# R2_PUBLIC_BUCKET_ID    (opcional — se usar R2 para PDFs)

# KV namespace para rate limiting e health monitor
[[kv_namespaces]]
binding = "TT_KV"
id = "CONFIGURE_KV_ID_HERE"

# Crons:
# - Sexta 23:00 UTC (20:00 BRT): apuração Sistema Loteria TT
# - Toda hora: health monitor (checa componentes, detecta ataques, alerta via email)
[triggers]
crons = ["0 23 * * 5", "0 * * * *"]
