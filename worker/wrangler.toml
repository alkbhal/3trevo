name = "tres-trevo-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (configurar via: npx wrangler secret put NOME)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# RESEND_API_KEY
# WEBHOOK_HMAC_SECRET
# ANTHROPIC_KEY
# R2_PUBLIC_BUCKET_ID    (opcional — se usar R2 para PDFs)

# KV namespace para rate limiting e health monitor
[[kv_namespaces]]
binding = "TT_KV"
id = "34f4ad1650394b77a51ae527a0437a24"

# R2 bucket privado para EPUBs da Biblioteca TT
[[r2_buckets]]
binding = "BIBLIOTECA_R2"
bucket_name = "tt-biblioteca"

# Crons:
# - Toda hora: health monitor (checa componentes, detecta ataques, alerta via email)
# Sorteio puro RNG: disparado manualmente via POST /api/admin/sorteio (sem data fixa)
[triggers]
crons = ["0 * * * *"]
